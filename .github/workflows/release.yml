name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run check

      - name: Build (production)
        run: npm run build

      - name: Unit tests
        run: npx vitest run test/unit

      - name: Offline integration tests
        run: npx vitest run test/integration/mcp.test.ts test/integration/planGraph.test.ts

      - name: Publish to VS Code Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: npx @vscode/vsce publish --no-dependencies

      - name: Package VSIX (release artifact)
        run: npx @vscode/vsce package --no-dependencies

      - name: Attach VSIX to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: "*.vsix"
          generate_release_notes: true
